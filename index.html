<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title></title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background:#ffffff;
    color:#111;
}

/* Top bar */
.topbar{
    display:flex;
    align-items:center;
    padding:14px;
}
.back{
    font-size:22px;
    margin-right:10px;
}

/* App header */
.app-header{
    display:flex;
    padding:16px;
    gap:14px;
}
.app-icon{
    width:72px;
    height:72px;
    border-radius:16px;
}
.app-title h1{
    margin:0;
    font-size:20px;
}
.app-title p{
    margin:4px 0;
    color:#2563eb;
    font-size:14px;
}
.meta{
    font-size:12px;
    color:#666;
}

/* Stats */
.stats{
    display:flex;
    justify-content:space-around;
    padding:10px 0;
    border-top:1px solid #eee;
    border-bottom:1px solid #eee;
}
.stat{
    text-align:center;
    font-size:13px;
}
.stat b{
    display:block;
    font-size:14px;
}

/* Install button */
.install-wrap{
    padding:16px;
}
.install-btn{
    width:100%;
    background:#2563eb;
    color:#fff;
    border:none;
    padding:14px;
    font-size:16px;
    border-radius:28px;
    cursor:pointer;
}

/* Banner */
.banner{
    padding:16px;
}
.banner img{
    width:100%;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,0.12);
}

/* About */
.about{
    padding:16px;
}
.about h2{
    font-size:18px;
    margin-bottom:8px;
}
.about p{
    font-size:14px;
    color:#444;
    line-height:1.5;
}
</style>
</head>

<body>

<div class="topbar">
    <div class="back"></div>
</div>

<div class="app-header">
    <!-- APP LOGO -->
    <img class="app-icon" src="https://i.postimg.cc/zDg87YHG/garena-free-fire-max-logo.jpg">

    <div class="app-title">
        <h1>‎PROXY SERVER FF</h1>
        <p>‎PROXY SERVER FF_1.0.apk‎</p>
        <div class="meta"></div>
    </div>
</div>

<div class="stats">
    <div class="stat">
        <b>1.3 GB</b>
        Size
    </div>
    <div class="stat">
        <b>12+</b>
        Rated
    </div>
    <div class="stat">
        <b>1B+</b>
        Downloads
    </div>
</div>

<div class="install-wrap">
    <button class="install-btn" onclick="goDownload()">Install</button>
</div>

<!-- BOTTOM IMAGE -->
<div class="banner">
    <img src="https://i.postimg.cc/YSgVLnKW/Screenshot-20260113-204320.png">
</div>

<div class="about">
    <h2>About this game</h2>
    <p>
        Choice of over 1 billion players!  
        Ultimate battle royale experience on mobile.
    </p>
</div>

<script>
function goDownload(){
    window.location.href = "https://t.me/apk28bot";
}
</script>

</body>
</html>
