<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promptfy - Admin Control Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #141414;
            border: 1px solid #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        h2, h3 {
            margin-bottom: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #a0a0a0;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            background: #080808;
            border: 1px solid #1e1e1e;
            color: #fff;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
        }
        /* কাস্টম ইমেজ আপলোডার ডিজাইন */
        input[type="file"] {
            background: #080808;
            padding: 8px;
            cursor: pointer;
        }
        .preview-box {
            width: 100%;
            height: 150px;
            border: 2px dashed #333;
            border-radius: 8px;
            margin-top: 10px;
            display: none; /* ইমেজ সিলেক্ট করলে শো হবে */
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #080808;
        }
        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .btn-primary {
            width: 100%;
            background: #ccff00;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s ease;
        }
        .btn-cancel {
            width: 100%;
            background: #222;
            color: #fff;
            border: 1px solid #333;
            padding: 8px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 8px;
            display: none;
        }
        /* Stats & Switch Styles */
        .stats-box, .ads-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #080808;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #1e1e1e;
            margin-bottom: 10px;
        }
        .stats-box span i {
            color: #ccff00;
            margin-right: 5px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #ccff00;
        }
        input:checked + .slider:before {
            transform: translateX(24px);
            background-color: #000;
        }
        /* Prompt List Styles */
        .prompt-item {
            background: #080808;
            border: 1px solid #1e1e1e;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .prompt-item img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            background: #222;
        }
        .prompt-details {
            flex-grow: 1;
            overflow: hidden;
        }
        .prompt-details h4 {
            font-size: 0.9rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .action-btns {
            display: flex;
            gap: 6px;
        }
        .btn-edit, .btn-delete {
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }
        .btn-edit {
            background: #1c2012;
            color: #ccff00;
            border: 1px solid #2d3319;
        }
        .btn-delete {
            background: #2d1212;
            color: #ff3333;
            border: 1px solid #441919;
        }
    </style>
</head>
<body>

    <div class="container">
        <h3><i class="fa-solid fa-chart-pie" style="color: #ccff00;"></i> Dashboard & Settings</h3>
        <div class="stats-box">
            <span><i class="fa-solid fa-users"></i> Total Visitors:</span>
            <strong id="visitorCount" style="color: #ccff00;">0</strong>
        </div>
        <div class="stats-box">
            <span><i class="fa-solid fa-layer-group"></i> Total Prompts:</span>
            <strong id="totalPromptsCount" style="color: #ccff00;">0</strong>
        </div>
        <div class="ads-box" style="margin-top: 15px;">
            <span>Website Advertisement</span>
            <label class="switch">
                <input type="checkbox" id="adsToggle" onchange="toggleAds(this.checked)">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="container">
        <h2 id="formTitle"><i class="fa-solid fa-plus" style="color: #ccff00;"></i> Add New Prompt</h2>
        
        <div class="form-group">
            <label>Title</label>
            <input type="text" id="promptTitle" placeholder="Enter title...">
        </div>
        
        <div class="form-group">
            <label>Upload Image (গ্যালারি থেকে ছবি সিলেক্ট করুন)</label>
            <input type="file" id="promptFile" accept="image/*" onchange="previewAndConvertImage(this)">
            <div class="preview-box" id="imagePreviewContainer">
                <img id="imagePreview" src="" alt="Selected Image Preview">
            </div>
        </div>
        
        <div class="form-group">
            <label>Prompt Text</label>
            <textarea id="promptText" rows="4" placeholder="Enter AI prompt..."></textarea>
        </div>
        
        <button class="btn-primary" id="submitBtn" onclick="handleFormSubmit()">Upload Prompt</button>
        <button class="btn-cancel" id="cancelEditBtn" onclick="cancelEditMode()">Cancel Edit</button>
    </div>

    <div class="container">
        <h3><i class="fa-solid fa-list-check" style="color: #ccff00;"></i> Manage Prompts</h3>
        <div id="adminPromptList">Loading prompts...</div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBx41WBQnxRsjrylnXoxWG2Yc8oHaB_5XM",
            authDomain: "hhhhjkk9-3063d.firebaseapp.com",
            databaseURL: "https://hhhhjkk9-3063d-default-rtdb.firebaseio.com",
            projectId: "hhhhjkk9-3063d",
            storageBucket: "hhhhjkk9-3063d.firebasestorage.app",
            messagingSenderId: "69289174757",
            appId: "1:69289174757:web:01fec92c7e03c3f9e3160c"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // গলোবাল ভ্যারিয়েবল
        let editMode = false;
        let currentEditId = null;
        let localPromptsCache = {};
        let encodedImageString = ""; // এখানে ইমেজের ডাটা স্টোর হবে

        // ১. ভিজিটর সংখ্যা ট্র্যাকিং
        database.ref('visitors_count').on('value', function(snapshot) {
            document.getElementById('visitorCount').innerText = snapshot.val() || 0;
        });

        // ২. ডাটাবেজ থেকে লাইভ অ্যাড স্ট্যাটাস নিয়ে সুইচ সেট করা
        database.ref('settings/ads_enabled').on('value', function(snapshot) {
            const isEnabled = snapshot.val() !== false; 
            document.getElementById('adsToggle').checked = isEnabled;
        });

        // ৩. অ্যাড অন/অফ করার ফাংশন
        function toggleAds(status) {
            database.ref('settings').update({
                ads_enabled: status
            }).then(() => {
                alert(status ? "বিজ্ঞাপন চালু করা হয়েছে! 🟢" : "বিজ্ঞাপন বন্ধ করা হয়েছে! 🔴");
            });
        }

        // ৪. ইমেজ সিলেক্ট করলে প্রিভিউ দেখানো এবং ডাটা এনকোড করার ফাংশন
        function previewAndConvertImage(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    encodedImageString = e.target.result; // ছবি কনভার্ট হয়ে রেডি হলো
                    
                    // প্রিভিউ বক্সে ছবি শো করানো
                    document.getElementById('imagePreview').src = encodedImageString;
                    document.getElementById('imagePreviewContainer').style.display = 'flex';
                }
                reader.readAsDataURL(file);
            }
        }

        // ৫. ফর্ম সাবমিট হ্যান্ডলার (আপলোড এবং আপডেট)
        function handleFormSubmit() {
            const title = document.getElementById('promptTitle').value.trim();
            const prompt = document.getElementById('promptText').value.trim();

            if (!title || !prompt || !encodedImageString) {
                alert("দয়া করে টাইটেল, প্রম্পট টেক্সট এবং একটি ইমেজ আপলোড করুন!");
                return;
            }

            if (editMode && currentEditId) {
                // আপডেট করার লজিক
                database.ref('prompts').child(currentEditId).update({
                    title: title,
                    image: encodedImageString,
                    prompt: prompt
                }).then(() => {
                    alert("প্রম্পটটি সফলভাবে আপডেট করা হয়েছে! ✏️");
                    cancelEditMode();
                }).catch(err => alert("আপডেট ব্যর্থ হয়েছে: " + err.message));

            } else {
                // নতুন আপলোড করার লজিক
                const newPromptRef = database.ref('prompts').push();
                newPromptRef.set({
                    title: title,
                    image: encodedImageString,
                    prompt: prompt,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                }).then(() => {
                    alert("নতুন প্রম্পট সফলভাবে আপলোড হয়েছে! 🎉");
                    clearForm();
                }).catch(err => alert("আপলোড ব্যর্থ হয়েছে: " + err.message));
            }
        }

        // ৬. এডিট মোড চালু করা
        function startEdit(id) {
            const item = localPromptsCache[id];
            if (!item) return;

            editMode = true;
            currentEditId = id;

            document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-pen-to-square" style="color: #ccff00;"></i> Edit Prompt`;
            document.getElementById('submitBtn').innerText = "Update Prompt";
            document.getElementById('cancelEditBtn').style.display = "block";

            // ডাটা লোড করা
            document.getElementById('promptTitle').value = item.title;
            document.getElementById('promptText').value = item.prompt;
            encodedImageString = item.image; // আগের ইমেজ ব্যাকআপে রাখা

            // প্রিভিউ বক্স শো করানো
            document.getElementById('imagePreview').src = item.image;
            document.getElementById('imagePreviewContainer').style.display = 'flex';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ৭. এডিট মোড বাতিল করা
        function cancelEditMode() {
            editMode = false;
            currentEditId = null;
            document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-plus" style="color: #ccff00;"></i> Add New Prompt`;
            document.getElementById('submitBtn').innerText = "Upload Prompt";
            document.getElementById('cancelEditBtn').style.display = "none";
            clearForm();
        }

        function clearForm() {
            document.getElementById('promptTitle').value = "";
            document.getElementById('promptText').value = "";
            document.getElementById('promptFile').value = "";
            document.getElementById('imagePreviewContainer').style.display = 'none';
            document.getElementById('imagePreview').src = "";
            encodedImageString = "";
        }

        // ৮. লাইভ প্রম্পট লিস্ট শো করা
        database.ref('prompts').orderByChild('timestamp').on('value', function(snapshot) {
            const listContainer = document.getElementById('adminPromptList');
            listContainer.innerHTML = "";
            
            let count = 0;
            let itemsHTML = "";
            localPromptsCache = {};

            snapshot.forEach(childSnapshot => {
                const id = childSnapshot.key;
                const item = childSnapshot.val();
                localPromptsCache[id] = item;
                count++;

                itemsHTML = `
                    <div class="prompt-item">
                        <img src="${item.image}" alt="">
                        <div class="prompt-details">
                            <h4>${item.title}</h4>
                        </div>
                        <div class="action-btns">
                            <button class="btn-edit" onclick="startEdit('${id}')" title="Edit">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="btn-delete" onclick="deletePrompt('${id}')" title="Delete">
                                <i class="fa-regular fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                ` + itemsHTML;
            });

            document.getElementById('totalPromptsCount').innerText = count;

            if (count === 0) {
                listContainer.innerHTML = "<p style='color: #7a7a7a; text-align: center;'>কোনো প্রম্পট পাওয়া যায়নি।</p>";
            } else {
                listContainer.innerHTML = itemsHTML;
            }
        });

        // ৯. প্রম্পট ডিলিট করা
        function deletePrompt(id) {
            if (confirm("আপনি কি নিশ্চিত যে এই প্রম্পটটি ডিলিট করতে চান?")) {
                if(currentEditId === id) {
                    cancelEditMode();
                }
                
                database.ref('prompts').child(id).remove().then(() => {
                    alert("প্রম্পটটি ডিলিট করা হয়েছে! 🗑️");
                }).catch(err => {
                    alert("ডিলিট করা যায়নি: " + err.message);
                });
            }
        }
    </script>
</body>
</html>
